services:
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mcp-file-classifier
    restart: "no"
    stdin_open: true   # Nécessaire pour MCP (communication stdio)
    tty: true
    env_file:
      - ../.env   # Utilise le .env à la racine du projet
    environment:
      # URL d'Ollama (sur l'hôte Windows, override pour Docker)
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Dossier à trier (dans le conteneur)
      - FILES_TO_SORT=/files
    volumes:
      # Monte le dossier à trier
      - ../files_to_sort:/files
    # Lance le serveur MCP
    command: ["python", "src/tools/server.py"]
