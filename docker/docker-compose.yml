services:
  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mcp-file-classifier
    restart: "no"
    network_mode: "host"
    environment:
      # URL d'Ollama (sur l'hôte)
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Modèle Ollama à utiliser
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-llama3:latest}
      # Dossier à trier (dans le conteneur)
      - FILES_TO_SORT=/files
    volumes:
      # Monte le dossier à trier (chemin depuis le dossier docker/)
      - ../files_to_sort:/files
    command: ["python", "main.py", "--folder", "/files"]

